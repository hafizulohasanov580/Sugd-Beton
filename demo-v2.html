/* Layout: рабочий табель. ПК: слева панель месяцев, справа сводка и таблица. Телефон: одна колонка, сводка внизу.
   Форма: элементы управления и клетки 4px, панели 8px, денежные метки (аванс/выплата) - таблетки. */
:root{
  --bg:#ECEDEA; --rail:#E4E5E1; --panel:#F7F7F5; --raised:#FCFCFB; --sel:#DCDED9;
  --line:#D3D5D0; --line-2:#BFC2BC;
  --ink:#17191A; --muted:#565C5F; --faint:#878D8F;
  --accent:#F26A1B; --accent-ink:#1A0F07; --accent-text:#B9480B; --accent-soft:rgba(242,106,27,.13);
  --paid:#2E7D52; --paid-ink:#F4FBF6;
  --absent:#C2344C; --absent-soft:rgba(194,52,76,.08);
  --hatch:rgba(23,25,26,.055); --today:rgba(242,106,27,.07); --hover:rgba(23,25,26,.03);
  --scrim:rgba(23,25,26,.38); --shadow:0 18px 50px -20px rgba(40,44,40,.35);
  --f-display:'Unbounded','Onest',system-ui,sans-serif;
  --f-text:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Onest',monospace;
  --name-w:244px; --cell-w:44px; --tot-w:132px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121413; --rail:#161918; --panel:#191C1B; --raised:#1F2321; --sel:#262B29;
    --line:#2B302E; --line-2:#3A403D;
    --ink:#E6E8E3; --muted:#A0A6A2; --faint:#6F7672;
    --accent:#FF7A2E; --accent-ink:#1A0F07; --accent-text:#FF9A5C; --accent-soft:rgba(255,122,46,.15);
    --paid:#4FBF85; --paid-ink:#08190F;
    --absent:#F17C90; --absent-soft:rgba(241,124,144,.1);
    --hatch:rgba(230,232,227,.04); --today:rgba(255,122,46,.08); --hover:rgba(230,232,227,.03);
    --scrim:rgba(6,8,7,.62); --shadow:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121413; --rail:#161918; --panel:#191C1B; --raised:#1F2321; --sel:#262B29;
  --line:#2B302E; --line-2:#3A403D;
  --ink:#E6E8E3; --muted:#A0A6A2; --faint:#6F7672;
  --accent:#FF7A2E; --accent-ink:#1A0F07; --accent-text:#FF9A5C; --accent-soft:rgba(255,122,46,.15);
  --paid:#4FBF85; --paid-ink:#08190F;
  --absent:#F17C90; --absent-soft:rgba(241,124,144,.1);
  --hatch:rgba(230,232,227,.04); --today:rgba(255,122,46,.08); --hover:rgba(230,232,227,.03);
  --scrim:rgba(6,8,7,.62); --shadow:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-text);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:300;background-image:var(--grain);opacity:.05;mix-blend-mode:multiply}
:root[data-theme="dark"] body::after{mix-blend-mode:screen;opacity:.035}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) body::after{mix-blend-mode:screen;opacity:.035} }
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:18px;height:18px;flex:none;display:block}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* кнопки */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:4px;font-weight:600;font-size:14px;white-space:nowrap;border:1px solid transparent;transition:background .15s,border-color .15s,transform .08s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:var(--raised);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--line-2)}
.btn-danger{background:var(--absent);color:var(--raised)}
.btn-paid{background:var(--paid);color:var(--paid-ink)}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:4px;border:1px solid var(--line);background:var(--raised);transition:border-color .15s,transform .08s}
.icon-btn:hover{border-color:var(--line-2)}
.icon-btn:active{transform:scale(.95)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--raised)}
.seg button{height:32px;min-width:40px;padding:0 10px;font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--muted);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.active{background:var(--ink);color:var(--bg)}
.theme-ic .sun{display:none}
:root[data-theme="dark"] .theme-ic .sun{display:block} :root[data-theme="dark"] .theme-ic .moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .theme-ic .sun{display:block} :root:not([data-theme="light"]) .theme-ic .moon{display:none} }

/* знак */
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:28px;height:28px;border-radius:4px;background:var(--accent);flex:none;display:grid;place-items:center}
.mark span{width:12px;height:12px;border:2.5px solid var(--accent-ink);border-radius:2px}
.word{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.5px;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-text);letter-spacing:0;font-weight:400}

/* ---------- вход ---------- */
.login{position:fixed;inset:0;z-index:20;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.login-art{position:relative;overflow:hidden;background:var(--accent);color:var(--accent-ink);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between}
.login-art::before{content:"";position:absolute;inset:0;background-image:var(--grain);opacity:.22;mix-blend-mode:multiply;pointer-events:none}
.login-art .brand{position:relative}
.login-art .mark{background:var(--accent-ink)} .login-art .mark span{border-color:var(--accent)}
.art-word{position:relative;font-family:var(--f-display);font-weight:700;font-size:clamp(56px,8.4vw,128px);line-height:.92;letter-spacing:-2px;margin:0}
.art-sub{position:relative;font-size:18px;font-weight:600;margin:18px 0 0;max-width:30ch}
.login-side{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:40px 24px;gap:28px;overflow:auto}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:6px}
.login-box h1{font-family:var(--f-text);font-size:30px;font-weight:700;letter-spacing:-.6px;margin:0}
.lead{color:var(--muted);margin:0 0 18px}
.choices{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.choice{display:flex;align-items:center;gap:14px;padding:16px;text-align:left;border-top:1px solid var(--line);transition:background .15s}
.choice:first-child{border-top:0}
.choice:hover{background:var(--raised)}
.choice .ci{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;background:var(--sel);flex:none}
.choice b{display:block;font-size:15px}
.choice small{color:var(--muted);font-size:13px}
.choice .chev{margin-left:auto;color:var(--faint)}
.link-demo{display:inline-flex;align-items:center;gap:8px;margin-top:14px;align-self:flex-start;color:var(--accent-text);font-weight:600;padding:6px 0;border-bottom:1px solid currentColor}
.login-foot{display:flex;gap:8px;align-items:center;width:100%;max-width:380px}

/* ---------- PIN ---------- */
.pin{position:fixed;inset:0;z-index:21;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);overflow:auto}
.pin-box{width:100%;max-width:330px;display:flex;flex-direction:column;align-items:center;text-align:center}
.pin-box .brand{margin-bottom:28px}
.pin-box h2{margin:0;font-size:24px;letter-spacing:-.4px}
.pin-box p{margin:6px 0 0;color:var(--muted)}
.dots{display:flex;gap:12px;margin:26px 0}
.dots span{width:14px;height:14px;border-radius:3px;border:2px solid var(--line-2);transition:background .12s,border-color .12s}
.dots span.on{background:var(--ink);border-color:var(--ink)}
.keypad{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{height:56px;border-radius:4px;border:1px solid var(--line);background:var(--panel);font-family:var(--f-num);font-size:22px;font-weight:500;display:grid;place-items:center;transition:background .1s,transform .08s}
.keypad button:hover{background:var(--raised)}
.keypad button:active{transform:scale(.96);background:var(--sel)}
.keypad .soft{background:transparent;border-color:transparent;color:var(--muted)}
.pin-box .btn{width:100%;height:48px;margin-top:12px}
.shake{animation:shake .36s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- приложение ---------- */
.app{height:100%;display:grid;grid-template-columns:232px minmax(0,1fr)}
.rail{display:flex;flex-direction:column;gap:22px;padding:22px 14px 16px;background:var(--rail);border-right:1px solid var(--line);overflow:auto}
.rail .brand{padding:0 6px}
.year{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.year select{appearance:none;-webkit-appearance:none;border:0;background:transparent;font-family:var(--f-num);font-weight:700;font-size:16px;text-align:center;padding:4px 8px;border-radius:4px;cursor:pointer}
.year select:hover{background:var(--sel)}
.year select option{background:var(--panel);color:var(--ink)}
.year .icon-btn{width:32px;height:32px;background:transparent;border-color:transparent}
.year .icon-btn:hover{background:var(--sel)}
.months{display:flex;flex-direction:column;gap:2px}
.months button{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 10px;border-radius:4px;color:var(--muted);font-weight:500;text-align:left}
.months button:hover{background:var(--sel);color:var(--ink)}
.months button.active{background:var(--ink);color:var(--bg);font-weight:600}
.months button em{font-style:normal;font-family:var(--f-num);font-size:11px;color:var(--accent-text)}
.months button.active em{color:var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rail-row{display:flex;gap:8px}
.rail-row .btn{flex:1;justify-content:flex-start;height:36px;padding:0 10px;font-weight:500}
.btn-exit:hover{color:var(--absent);border-color:var(--absent)}

.main{min-width:0;height:100%;display:flex;flex-direction:column;gap:16px;padding:22px 24px 20px;overflow:hidden}
.mbar{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.title{display:flex;align-items:center;gap:14px;flex-wrap:wrap;min-width:0}
.title h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:30px;letter-spacing:-.8px;line-height:1.1;white-space:nowrap}
.title h1 span{color:var(--faint)}
.mnav{display:none}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:4px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:600}
.tools{display:flex;align-items:center;gap:8px}
.search{position:relative;width:240px}
.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);width:16px;height:16px}
.search input{width:100%;height:38px;padding:0 12px 0 34px;border-radius:4px;border:1px solid var(--line);background:var(--raised);outline:none}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--ink)}
.mstrip{display:none}

.ledger{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.lg-cell{padding:14px 18px;border-left:1px solid var(--line);min-width:0}
.lg-cell:first-child{border-left:0}
.lg-k{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lg-v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:25px;font-weight:700;letter-spacing:-.6px;margin-top:2px;white-space:nowrap}
.lg-v small{font-size:12px;font-weight:500;color:var(--faint);margin-left:6px;letter-spacing:0}
.lg-cell.paid .lg-v{color:var(--paid)}
.lg-cell.bal{background:var(--accent);color:var(--accent-ink);border-radius:0 7px 7px 0;border-left-color:transparent}
.lg-cell.bal .lg-k,.lg-cell.bal .lg-v small{color:var(--accent-ink);opacity:.75}

.sheet{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.view{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
table{border-collapse:separate;border-spacing:0;min-width:100%}
thead th{position:sticky;top:0;z-index:3;background:var(--panel);height:54px;padding:0;border-bottom:1px solid var(--line-2);font-weight:500;text-align:center}
th.cd{min-width:var(--cell-w);width:var(--cell-w)}
th.cd .dn{display:block;font-family:var(--f-num);font-size:13px;font-weight:700;color:var(--ink)}
th.cd .wd{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
th.cd.sunday .dn,th.cd.sunday .wd{color:var(--absent)}
th.cd.today .dn{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 4px;border-radius:4px;background:var(--accent);color:var(--accent-ink)}
th.cd.today .wd{color:var(--accent-text);font-weight:600}
.cw{position:sticky;left:0;z-index:2;background:var(--panel);min-width:var(--name-w);width:var(--name-w);max-width:var(--name-w);border-right:1px solid var(--line-2);text-align:left}
thead .cw{z-index:4;padding:0 16px;color:var(--muted);font-size:13px}
.th-name{display:flex;align-items:center;gap:8px}
.cnt{font-family:var(--f-num);font-size:11px;font-weight:700;color:var(--ink);background:var(--sel);border-radius:4px;padding:1px 6px}
.ct{position:sticky;right:0;z-index:2;background:var(--panel);min-width:var(--tot-w);width:var(--tot-w);border-left:1px solid var(--line-2);text-align:right;padding:0 16px}
thead .ct{z-index:4;color:var(--muted);font-size:13px}
tbody td{border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
td.cd{text-align:center;padding:8px 0}
td.cd.sunday,th.cd.sunday{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 1px,transparent 1px 7px)}
td.cd.today{background-color:var(--today)}
tbody tr:hover td.cd{box-shadow:inset 0 0 0 999px var(--hover)}
tbody tr:hover td.cw,tbody tr:hover td.ct{background:var(--raised)}

.wk{display:flex;align-items:flex-start;gap:8px;padding:10px 10px 10px 16px}
.wk-main{min-width:0;flex:1}
.wk-name{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-meta{font-family:var(--f-num);font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap}
.rate{display:inline-flex;align-items:center;gap:6px;margin-top:6px;color:var(--faint);font-size:12px}
.rate input{width:62px;height:24px;border-radius:4px;border:1px solid var(--line);background:var(--raised);font-family:var(--f-num);font-weight:700;font-size:12.5px;text-align:center;color:var(--ink);outline:none;-moz-appearance:textfield}
.rate input:focus{border-color:var(--ink)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wk-del{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--faint);opacity:0;transition:opacity .15s,color .15s,background .15s}
tr:hover .wk-del,.wk-del:focus-visible{opacity:1}
.wk-del:hover{color:var(--absent);background:var(--absent-soft)}
.wk-del .i{width:16px;height:16px}
.tot-v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:700;font-size:15.5px;letter-spacing:-.3px}
.tot-v.neg{color:var(--absent)} .tot-v.zero{color:var(--faint)}
.tot-c{font-size:11px;color:var(--faint)}

/* клетки: день - «пробитая карточка», деньги - таблетки */
.sq-h{width:32px;height:28px;margin:0 auto;border-radius:4px;border:1px solid var(--line-2);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:12px;color:var(--ink);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:background .12s,border-color .12s,transform .08s}
.sq-h:hover{border-color:var(--ink)}
.sq-h:active{transform:scale(.9)}
.sq-h.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.sq-h.off{background:var(--absent-soft);border-color:var(--absent);color:var(--absent)}
.sq-h.part{border:1.5px solid var(--ink)}
.sq-h.on::after,.sq-h.off::after{content:"";width:15px;height:15px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.sq-h.on::after{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%20fill%3D%22currentColor%22%3E%3Cpath%20d%3D%22M232.49%2C80.49l-128%2C128a12%2C12%2C0%2C0%2C1-17%2C0l-56-56a12%2C12%2C0%2C1%2C1%2C17-17L96%2C183%2C215.51%2C63.51a12%2C12%2C0%2C0%2C1%2C17%2C17Z%22%2F%3E%3C%2Fsvg%3E")}
.sq-h.off::after{--m:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20256%20256%22%20fill%3D%22currentColor%22%3E%3Cpath%20d%3D%22M208.49%2C191.51a12%2C12%2C0%2C0%2C1-17%2C17L128%2C145%2C64.49%2C208.49a12%2C12%2C0%2C0%2C1-17-17L111%2C128%2C47.51%2C64.49a12%2C12%2C0%2C0%2C1%2C17-17L128%2C111l63.51-63.52a12%2C12%2C0%2C0%2C1%2C17%2C17L145%2C128Z%22%2F%3E%3C%2Fsvg%3E");width:13px;height:13px}
.sq-a{width:32px;height:16px;margin:5px auto 0;border-radius:99px;border:1px dashed var(--line-2);display:grid;place-items:center;font-family:var(--f-num);font-size:10px;font-weight:700;color:var(--faint);cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;overflow:hidden;white-space:nowrap;letter-spacing:-.3px;transition:transform .08s,border-color .12s}
.sq-a:hover{border-color:var(--accent);color:var(--accent-text)}
.sq-a:active{transform:scale(.9)}
.sq-a.on-adv{background:var(--accent);border:0;color:var(--accent-ink)}
.sq-a.on-pay{background:var(--paid);border:0;color:var(--paid-ink)}

.panel-foot{display:flex;align-items:center;gap:18px;padding:10px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.lg i{display:inline-grid;place-items:center;width:18px;height:16px;border-radius:3px;border:1px solid var(--line-2);font-style:normal;font-family:var(--f-num);font-size:9.5px;font-weight:700;color:var(--ink)}
.lg i.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lg i.off{background:var(--absent-soft);border-color:var(--absent);color:var(--absent)}
.lg i .i{width:11px;height:11px}
.lg i.a{width:24px;height:12px;border-radius:99px;border:0;background:var(--accent)}
.lg i.p{width:24px;height:12px;border-radius:99px;border:0;background:var(--paid)}
.linkbtn{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;white-space:nowrap}
.linkbtn:hover{color:var(--ink)}
.linkbtn .i{width:16px;height:16px}

.empty{position:absolute;inset:54px 0 44px 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:24px;background:var(--panel)}
.empty .ei{width:52px;height:52px;border-radius:8px;display:grid;place-items:center;background:var(--sel);margin-bottom:8px}
.empty .ei .i{width:26px;height:26px}
.empty b{font-size:17px}
.empty span{color:var(--muted);max-width:32ch}
.empty .btn{margin-top:12px}
.fab{display:none}

/* окна */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--scrim);animation:fade .16s ease}
.dlg{width:100%;max-width:390px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:22px;user-select:none;-webkit-user-select:none;animation:rise .2s cubic-bezier(.16,1,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dlg-top{display:flex;gap:12px;align-items:flex-start}
.dlg-ic{width:40px;height:40px;border-radius:4px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent-text)}
.dlg-ic.pay{background:var(--sel);color:var(--paid)}
.dlg-ic.bad{background:var(--absent-soft);color:var(--absent)}
.dlg-ic.info{background:var(--sel);color:var(--ink)}
.dlg h3{margin:1px 0 0;font-size:18px;letter-spacing:-.3px}
.dlg .s-sub{margin:2px 0 0;color:var(--muted);font-size:13px}
.dlg-amount{margin:18px 0 0;padding:14px;border-radius:4px;background:var(--raised);border:1px solid var(--line);font-family:var(--f-num);font-size:30px;font-weight:700;letter-spacing:-.8px;text-align:center}
.dlg-amount small{font-size:13px;color:var(--faint);font-weight:500;margin-left:6px}
.field-l{display:block;margin-top:18px;font-size:13px;color:var(--muted);font-weight:500}
.field{width:100%;height:50px;margin-top:6px;padding:0 14px;border-radius:4px;border:1px solid var(--line-2);background:var(--raised);font-family:var(--f-num);font-size:20px;font-weight:700;outline:none;user-select:text;-webkit-user-select:text}
.field.text{font-family:var(--f-text);font-size:16px;font-weight:600}
.field:focus{border-color:var(--ink)}
.field::placeholder{color:var(--faint);font-weight:500}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick button{height:32px;padding:0 11px;border-radius:99px;border:1px solid var(--line);background:var(--raised);font-family:var(--f-num);font-weight:700;font-size:12.5px}
.quick button:hover{border-color:var(--ink)}
.quick button.clear{font-family:var(--f-text);font-weight:500;color:var(--muted)}
.dlg-actions{display:flex;gap:8px;margin-top:20px}
.dlg-actions .btn{flex:1;height:44px}
.help{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.help .lg{font-size:14px;color:var(--ink);gap:10px}
.help-n{margin:16px 0 0;padding:12px;border-radius:4px;background:var(--raised);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.55}

.toast{position:fixed;left:50%;bottom:24px;z-index:200;transform:translate(-50%,16px);opacity:0;pointer-events:none;max-width:calc(100% - 32px);padding:11px 16px;border-radius:4px;background:var(--ink);color:var(--bg);font-weight:500;box-shadow:var(--shadow);transition:opacity .18s,transform .22s cubic-bezier(.16,1,.3,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--absent);color:var(--raised)}

/* ноутбук поменьше */
@media (max-width:1180px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .search{width:180px}
  .lg-v{font-size:21px}
  .btn-pdf .t{display:none}
}
@media (max-width:980px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr;overflow:auto}
  .login-art{padding:24px 20px 28px;min-height:0}
  .art-word{font-size:clamp(44px,14vw,72px);margin-top:28px}
  .art-sub{font-size:16px;margin-top:10px}

        const okB = $('dlg-ok'), noB = $('dlg-cancel');

        $('dlg').classList.remove('hidden');
        if (o.input) setTimeout(() => inp.focus(), 60); else setTimeout(() => okB.focus(), 60);
        return new Promise(res => {
            const done = (val) => { $('dlg').classList.add('hidden'); dlgOpen = false; okB.onclick = noB.onclick = quick.onclick = $('dlg').onclick = $('dlg').onpointerdown = inp.onkeydown = null; document.removeEventListener('keydown', onKey, true); res(val); };
            const ok = () => done(o.input ? inp.value : true);
            const no = () => done(o.input ? null : false);
            const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); no(); } else if (e.key === 'Enter' && e.target !== noB && !e.target.closest('#dlg-quick')) { e.preventDefault(); ok(); } };

    // ---------- пример: данные только в памяти, ничего не записывается ----------
    function makeDemo() {
        const names = ['Шерзод Раҳимов','Фаррух Каримов','Далер Назаров','Сино Холов','Умед Саидов','Баҳром Мирзоев','Алишер Тошев','Ҷамшед Ғафуров'];
        const rates = [200, 180, 220, 170, 190, 250, 160, 210];
        let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const now = new Date();
        return names.map((n, i) => {
            const w = { n, r: rates[i], d: {} };
            for (let back = 1; back >= 0; back--) {
                const dt = new Date(now.getFullYear(), now.getMonth() - back, 1), y = dt.getFullYear(), m = dt.getMonth();
                const days = new Date(y, m + 1, 0).getDate(), last = back === 0 ? now.getDate() : days;
                for (let d = 1; d <= last; d++) {
                    if (new Date(y, m, d).getDay() === 0) continue;
                    const r = rnd(), k = `${y}_${m}_${d}`;
                    w.d[k] = { h: r < 0.06 ? -1 : (r < 0.14 ? [4, 6, 10, 12][Math.floor(rnd() * 4)] : 8) };
                }
                [6, 13, 21].forEach(d => { if (d <= last && rnd() < 0.55) { const k = `${y}_${m}_${d}`; w.d[k] = w.d[k] || {}; w.d[k].a = [100, 200, 300, 500][Math.floor(rnd() * 4)]; } });
                if (back === 0 && (i === 1 || i === 4) && last >= 15) { const k = `${y}_${m}_15`; w.d[k] = w.d[k] || {}; w.d[k].p = 1000; w.d[k].a = 0; }
                if (back === 1 && i < 6) { // прошлый месяц выплачен
                    let tot = 0; for (let d = 1; d <= days; d++) { const x = w.d[`${y}_${m}_${d}`] || {}; tot += (x.h > 0 ? x.h : 0) * (w.r / 8) - (x.a || 0) - (x.p || 0); }
                    const k = `${y}_${m}_${days}`; w.d[k] = w.d[k] || {}; w.d[k].p = tot; w.d[k].a = 0;
                }
            }
            return w;
        });
    }

    window.delW = async (i) => {
        const ok = await showDialog({ icon: 'trash', tone: 'bad', title: t('delT'), sub: t('delS', { n: workers[i].n }), okText: t('del'), okCls: 'btn-danger' });
        if(ok) { workers.splice(i,1); saveData(); }
    }
    window.fastA = async (i, k) => {
        let v = await showDialog({ icon: 'hand-coins', title: t('advT'), sub: `${workers[i].n}, ${dateLabel(k)}`, input: true, inputmode: 'decimal', label: t('advL'), placeholder: '0',
            quick: [100, 200, 300, 500, 1000].map(x => ({ v: String(x), label: String(x) })).concat([{ v: '0', label: t('clear'), cls: 'clear' }]) });
        if(v !== null) {
            if(!workers[i].d[k]) workers[i].d[k] = {};
            let num = parseFloat(v) || 0;
            workers[i].d[k].a = num;
            workers[i].d[k].p = 0;
            saveData();
        }
    }
    window.openPayModal = (e, i, k, remaining) => {
        if(e && e.preventDefault) e.preventDefault();
        if (dlgOpen) return;
        if(remaining <= 0 && (!workers[i].d[k] || !workers[i].d[k].p)) {
            toast(t('noBal'));
            return;
        }

        let payAmount = (workers[i].d[k] && workers[i].d[k].p) ? workers[i].d[k].p : remaining;
        activePayTarget = { i, k, amount: payAmount };
        showDialog({ icon: 'money', tone: 'pay', title: t('payT'), sub: `${workers[i].n}, ${dateLabel(k)}`, amount: `${fN(payAmount)}<small>${t('tjs')}</small>`, okText: t('payYes'), okCls: 'btn-paid' })
            .then(ok => { if (ok) payYes(); else window.closePayModal(); });
    }
    window.closePayModal = () => {
        activePayTarget = null;
    }
    function payYes() {
        if(activePayTarget) {
            const { i, k, amount } = activePayTarget;
            if(!workers[i].d[k]) workers[i].d[k] = {};
            workers[i].d[k].p = amount;
            workers[i].d[k].a = 0;
            saveData();
        }
        window.closePayModal();
    }
    window.setCus = async (e,i,k) => {
        if (e) { e.preventDefault(); if (lastPointerType === 'touch') return; }
        let v = await showDialog({ icon: 'clock', title: t('hT'), sub: `${workers[i].n}, ${dateLabel(k)}`, input: true, inputmode: 'numeric', label: t('hL'), placeholder: '8',
            quick: [2, 4, 6, 8, 10, 12].map(x => ({ v: String(x), label: x + ' ' + t('hShort') })).concat([{ v: '0', label: t('clear'), cls: 'clear' }]) });
        if(v !== null) { if(!workers[i].d[k]) workers[i].d[k]={}; workers[i].d[k].h = parseInt(v) || 0; saveData(); }
    }
    window.genPDF = () => {
        if (ARTIFACT) { toast(t('artPdf')); return; }
        if (!window.jspdf) { toast(t('pdfErr'), 'err'); return; }
        const { jsPDF } = window.jspdf;
        const docP = new jsPDF('l', 'mm', 'a4');
        const y = yS.value, m = mS.value;
        const monthNameLat = tr(dict['ru'].mo[m]);
        docP.setFontSize(18);
        docP.setTextColor(249, 115, 22);
        docP.text(`SUGD BETON REPORT - ${monthNameLat} ${y}`, 148, 15, {align:"center"});

        let grandTotal = 0;
        let rows = workers.map(w => {
            let totalSalary = 0, totalHours = 0, totalAdvance = 0, totalPaid = 0;
            const dCount = new Date(y, parseInt(m)+1, 0).getDate();
            for(let d=1; d<=dCount; d++){
                let k = `${y}_${m}_${d}`, h = w.d[k]?.h || 0, a = w.d[k]?.a || 0, p = w.d[k]?.p || 0;
                let cH = h > 0 ? h : 0;
                totalHours += cH;
                totalAdvance += a;
                totalPaid += p;
                totalSalary += (cH * (w.r/8)) - a - p;
            }
            grandTotal += totalSalary;

            let daysFormatted = (totalHours / 8).toFixed(1).replace('.0', '');

            return [
                tr(w.n),
                w.r,
                totalHours,
                daysFormatted,
                fN(totalAdvance),
                fN(totalPaid),
                fN(totalSalary) + " TJS"
            ];
        });
        rows.push([
            { content: 'GRAND TOTAL:', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } },
            { content: fN(grandTotal) + " TJS", styles: { fontStyle: 'bold', fillColor: [249, 115, 22], textColor: 255 } }
        ]);
        docP.autoTable({
            head: [['Master Name', 'Rate/Day', 'Hours', 'Days(8h)', 'Advance', 'Paid Out', 'Remaining']],
            body: rows,
            startY: 25,
            theme: 'grid',
            headStyles: { fillColor: [249, 115, 22], halign: 'center' },
            styles: { fontSize: 10, halign: 'center', cellPadding: 3 },
            columnStyles: {
                0: { halign: 'left', fontStyle: 'bold' },
                6: { fontStyle: 'bold' }
            }
        });
        docP.save(`Sugd_Beton_Report_${monthNameLat}_${y}.pdf`);
    }

    // ---------- запуск ----------
    for(let y=2025; y<=Math.max(2028, new Date().getFullYear()+1); y++) yS.add(new Option(y, y, false, y===new Date().getFullYear()));
    { const st = store.get('sb_theme'); if (st === 'light' || st === 'dark') document.documentElement.setAttribute('data-theme', st); }
    curL = ['ru', 'tj', 'en'].includes(store.get('sb_lang')) ? store.get('sb_lang') : 'ru';
    const isDemoUrl = ARTIFACT || new URLSearchParams(location.search).has('demo');
    if(!isDemoUrl && localStorage.getItem('user_mode')) { mode = localStorage.getItem('user_mode'); userUid = localStorage.getItem('user_uid') || 'local_user'; checkPinSetup().catch(() => toast(t('netErr'), 'err')); }
    setLang(curL);
    if (isDemoUrl) startDemo();
    document.getElementById('tBody').addEventListener('keydown', (e) => {
        if (e.target && e.target.matches('input[type=number]') && (e.key === 'Backspace' || e.key === 'Delete' || e.key.length === 1)) playKeySound();
    });
</script>
</body>
