<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUGD BETON</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --p: #f97316; --bg: #0f172a; --card: #1e293b; --txt: #f8fafc; --brd: #475569; --s: #22c55e; --sun: #ef4444; --pay: #3b82f6; }
        body.light { --bg: #f8fafc; --card: #ffffff; --txt: #0f172a; --brd: #cbd5e1; --sun: #ef4444; }
        
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; transition: background 0.1s; -webkit-tap-highlight-color: transparent; }
        
        body { margin: 0; background: var(--bg); color: var(--txt); font-size: 12px; height: 100vh; display: flex; flex-direction: column; user-select: none; }
        
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; border:none; border-bottom: 1px solid var(--brd); background: transparent; color: var(--p); font-weight: bold; width: 50px; text-align: center; outline: none; }
        
        .screen { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
        .hidden { display: none !important; }
        .box { background: var(--card); padding: 25px; border-radius: 16px; border: 1px solid var(--p); text-align: center; width: 320px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .logo { font-size: 26px; font-weight: 900; color: var(--txt); margin-bottom: 25px; }
        .logo span { color: var(--p); }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-top: 12px; font-size: 14px; }
        .btn-white { background: #fff; color: #000; }
        .btn-dark { background: #334155; color: #fff; border: 1px solid var(--brd); }
        .btn-orange { background: var(--p); color: #fff; }
        
        .header { background: var(--card); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--p); flex-shrink: 0; gap: 8px; }
        .lang-s { display: flex; gap: 4px; align-items: center; }
        .l-btn { background: var(--brd); padding: 6px 8px; border-radius: 6px; border: none; color: #fff; cursor: pointer; font-size: 11px; font-weight: bold; }
        .l-btn.active { background: var(--p) !important; color: #fff !important; }
        .btn-act { background: #fff; color: #000; border: none; padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11px; }

        .date-panel { padding: 8px 12px; display: flex; gap: 8px; background: var(--card); border-bottom: 1px solid var(--brd); flex-shrink: 0; }
        select { flex: 1; background: var(--bg); color: var(--txt); border: 1px solid var(--brd); padding: 6px; border-radius: 6px; outline: none; font-size: 12px; }

        .view { flex: 1; overflow: auto; width: 100%; position: relative; }
        
        .total-footer { background: var(--p); color: white; padding: 8px 10px; font-weight: bold; border-top: 2px solid var(--brd); font-size: 12px; flex-shrink: 0; z-index: 110; display: flex; justify-content: space-between; align-items: center; text-align: center; }
        .tf-item { display: flex; flex-direction: column; gap: 2px; flex: 1; }
        .tf-title { font-size: 9px; opacity: 0.95; text-transform: uppercase; letter-spacing: 0.3px; }
        .tf-val { font-size: 13px; font-weight: 900; }
        
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        thead th { position: sticky; top: 0; background: var(--card); z-index: 50; padding: 10px; border-bottom: 1px solid var(--p); color: var(--txt); font-size: 11px; }
        
        .cw { position: sticky; left: 0; z-index: 60; width: 150px; background: var(--card); padding: 10px; border-right: 2px solid var(--p); font-weight: bold; line-height: 1.2; }
        .cd { width: 35px; text-align: center; border-right: 1px solid var(--brd); position: relative; }
        
        .cd.sunday { background-color: rgba(255, 0, 0, 0.35) !important; color: #ff3333 !important; font-weight: bold; }
        thead th.cd.sunday { background-color: #ff0000 !important; color: #ffffff !important; }

        .ct { width: 80px; position: sticky; right: 0; background: var(--card); z-index: 40; border-left: 2px solid var(--p); text-align: center; color: var(--s); font-weight: 900; font-size: 13px; }
        
        .sq-h { width: 24px; height: 24px; border: 1px solid var(--brd); border-radius: 5px; margin: 3px auto; display: flex; align-items: center; justify-content: center; cursor: pointer; background: var(--bg); font-size: 12px; color: var(--p); font-weight: bold; user-select: none; }
        .sq-h.on { background: var(--s); color: #000; border: none; }
        .sq-h.on::after { content: '✓'; }
        .sq-h.off { background: var(--sun); color: #fff; border: none; }
        .sq-h.off::after { content: '✕'; font-weight: 900; font-size: 14px; }

        .sq-a { width: 22px; height: 16px; border: 1px dashed var(--p); border-radius: 10px; margin: 3px auto; cursor: pointer; font-size: 9px; color: var(--p); display: flex; align-items: center; justify-content: center; user-select: none; touch-action: none; }
        .sq-a.on-adv { background: var(--p); color: #fff; border-style: solid; }
        .sq-a.on-pay { background: var(--pay); color: #fff; border-style: solid; }

        .modal-btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn-yes { background: var(--s); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 15px; }
        .btn-no { background: var(--sun); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 15px; }
    </style>
</head>
<body id="mainBody">

<div id="screen-login" class="screen">
    <div class="box">
        <div class="logo">SUGD <span>BETON</span></div>
        <button class="btn btn-white" id="btn-google">G Google (Облако)</button>
        <button class="btn btn-dark" onclick="authLocal()">💾 Только устройство</button>
    </div>
</div>

<div id="screen-pin" class="screen hidden">
    <div class="box">
        <h3 id="pin-title">Введите PIN</h3>
        <input type="tel" id="pin-input" style="width:100%; font-size:28px; text-align:center; padding:10px; border-radius:8px; border:1px solid var(--brd); background:var(--bg); color:var(--txt);" maxlength="4">
        <button class="btn btn-orange" onclick="checkPin()" id="btn-login-text">ВХОД</button>
    </div>
</div>

<!-- Модальное окно выплаты ЗП -->
<div id="modal-pay" class="screen hidden">
    <div class="box">
        <h3 id="pay-msg" style="font-size:16px; margin:0; line-height:1.4;">Выплатить остаток?</h3>
        <div class="modal-btn-group">
            <button class="btn-yes" id="pay-btn-yes">ДА</button>
            <button class="btn-no" onclick="closePayModal()">НЕТ</button>
        </div>
    </div>
</div>

<div id="screen-app" class="hidden" style="display: flex; flex-direction: column; height: 100vh;">
    <div class="header">
        <div class="lang-s">
            <button class="l-btn" id="l-ru" onclick="setLang('ru')">RU</button>
            <button class="l-btn" id="l-tj" onclick="setLang('tj')">TJ</button>
            <button class="l-btn" id="l-en" onclick="setLang('en')">EN</button>
            <button class="l-btn" onclick="toggleTheme()" style="background:#475569">🌓</button>
        </div>

        <div class="lang-s">
            <button onclick="genPDF()" class="btn-act">PDF</button>
            <button onclick="addW()" class="btn-act" style="background:var(--p); color:#fff">+</button>
            <button id="btn-exit" onclick="location.reload()" style="background:var(--sun); color:#fff; border:none; padding:6px 8px; border-radius:6px; font-weight:bold; cursor:pointer; font-size:10px">EXIT</button>
        </div>
    </div>

    <div class="date-panel">
        <select id="mS" onchange="render()"></select>
        <select id="yS" onchange="render()"></select>
    </div>

    <div class="view">
        <table>
            <thead><tr id="hRow"><th class="cw" id="th-m">МАСТЕР</th><th class="ct" id="th-t">ИТОГО</th></tr></thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>
    
    <div class="total-footer" id="totalFooter"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBwc9X7c_8UHCb1KlKBLzwbBWHlf22s7a8", authDomain: "dizel-8f122.firebaseapp.com", projectId: "dizel-8f122", storageBucket: "dizel-8f122.firebasestorage.app", messagingSenderId: "648148623489", appId: "1:648148623489:web:193a3b9df407c5babfed80" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let mode = 'local', userUid = 'local_user', pinCode = null, workers = [], curL = 'ru';
    let activePayTarget = null;
    let holdTimer = null;
    let isLongPress = false;

    const dict = {
        ru: { m: "МАСТЕР", t: "ИТОГО", h: "Ч", d: "Д", r: "Ст", ph: "Имя мастера", exit: "ВЫХОД", pinT: "Введите PIN", pinN: "Новый PIN", enter: "ВХОД", adv: "Сумма аванса:", qh: "Часы:", mo: ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"], total: "ФОНД ЗП:", totAdv: "АВАНСЫ:", totPaid: "ВЫПЛАЧЕНО:", totBal: "ОСТАТОК:" },
        tj: { m: "УСТО", t: "ҶАЪМ", h: "С", d: "Р", r: "Н", ph: "Номи усто", exit: "ХУРУҶ", pinT: "Рамз", pinN: "Рамзи нав", enter: "ВОРУД", adv: "Маблағи аванс:", qh: "Соат:", mo: ["Январ","Феврал","Март","Апрел","Май","Июн","Июл","Август","Сентябр","Октябр","Ноябр","Декабр"], total: "ФОНДИ ИШХАҚҚИ:", totAdv: "АВАНСҲО:", totPaid: "ДОДА ШУД:", totBal: "БОҚИМОНДА:" },
        en: { m: "MASTER", t: "TOTAL", h: "H", d: "D", r: "R", ph: "Name", exit: "EXIT", pinT: "PIN", pinN: "New PIN", enter: "LOGIN", adv: "Advance amount:", qh: "Hours:", mo: ["January","February","March","April","May","June","July","August","September","October","November","December"], total: "PAYROLL FUND:", totAdv: "ADVANCES:", totPaid: "PAID OUT:", totBal: "REMAINING:" }
    };

    window.toggleTheme = () => document.getElementById('mainBody').classList.toggle('light');
    window.fN = (n) => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    window.tr = (s) => {
        const map = {'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'yo','ж':'zh','з':'z','и':'i','й':'j','к':'k','л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sch','ы':'y','э':'e','ю':'yu','я':'ya','ҷ':'j','қ':'q','ҳ':'h','ӯ':'u','ғ':'gh'};
        return s.toLowerCase().split('').map(c => map[c] || c).join('').toUpperCase();
    };

    window.authLocal = () => { mode = 'local'; localStorage.setItem('user_mode', 'local'); checkPinSetup(); }
    document.getElementById('btn-google').onclick = () => signInWithPopup(auth, provider).then(r => { mode = 'cloud'; userUid = r.user.uid; localStorage.setItem('user_mode', 'cloud'); localStorage.setItem('user_uid', r.user.uid); checkPinSetup(); });

    async function checkPinSetup() {
        if(mode === 'local') pinCode = localStorage.getItem('mp_pin');
        else { const ds = await getDoc(doc(db, "users", userUid)); if(ds.exists()) pinCode = ds.data().pin; }
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-pin').classList.remove('hidden');
        document.getElementById('pin-title').innerText = pinCode ? dict[curL].pinT : dict[curL].pinN;
    }

    window.checkPin = async function() {
        const v = document.getElementById('pin-input').value;
        if(!pinCode) { pinCode = v; if(mode==='local') localStorage.setItem('mp_pin',v); else await setDoc(doc(db,"users",userUid),{pin:v}); loadData(); }
        else if(v === pinCode) loadData(); else alert("Error!");
    }

    async function loadData() {
        document.getElementById('screen-pin').classList.add('hidden');
        document.getElementById('screen-app').classList.remove('hidden');
        if(mode === 'local') workers = JSON.parse(localStorage.getItem('mp_data')) || [];
        else { const ds = await getDoc(doc(db,"data",userUid)); if(ds.exists()) workers = ds.data().w || []; }
        render();
    }

    window.setLang = (l) => {
        curL = l;
        document.querySelectorAll('.l-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('l-'+l).classList.add('active');
        document.getElementById('th-m').innerText = dict[l].m;
        document.getElementById('th-t').innerText = dict[l].t;
        document.getElementById('btn-exit').innerText = dict[l].exit;
        const mS = document.getElementById('mS');
        const sel = mS.value;
        mS.innerHTML = '';
        dict[l].mo.forEach((m,i)=>mS.add(new Option(m,i,false,i===parseInt(sel||new Date().getMonth()))));
        render();
    }

    window.addW = () => {
        let n = prompt(dict[curL].ph);
        if(n) { workers.push({n:n, r:170, d:{}}); saveData(); }
    }

    window.render = function() {
        const y=yS.value, m=mS.value, days=new Date(y, parseInt(m)+1, 0).getDate();
        const hr = document.getElementById('hRow');
        while(hr.children.length > 2) hr.removeChild(hr.children[1]);
        
        for(let d=1; d<=days; d++) { 
            let th = document.createElement('th'); th.className='cd'; th.innerText=d; 
            if(new Date(y, parseInt(m), d).getDay() === 0) th.classList.add('sunday');
            hr.insertBefore(th, hr.children[d]); 
        }
        
        const tb = document.getElementById('tBody'); tb.innerHTML = '';
        let grandAccrued = 0, grandAdvance = 0, grandPaid = 0, grandBalance = 0;
        
        workers.forEach((w, idx) => {
            let total = 0, hours = 0, advanceSum = 0, paidSum = 0;
            for(let d=1; d<=days; d++) {
                let k=`${y}_${m}_${d}`, h=w.d[k]?.h||0, a=w.d[k]?.a||0, p=w.d[k]?.p||0;
                let calcH = (h > 0) ? h : 0; hours += calcH; 
                let accrued = calcH * (w.r/8);
                grandAccrued += accrued;
                advanceSum += a;
                paidSum += p;
                total += accrued - a - p;
            }

            grandAdvance += advanceSum;
            grandPaid += paidSum;
            grandBalance += total;

            let daysVal = (hours / 8).toFixed(1).replace('.0', '');
            let html = `<td class="cw">${w.n}<br><small>${dict[curL].h}: ${hours} | ${dict[curL].d}: ${daysVal}</small><br><input type="number" value="${w.r}" onchange="updR(${idx},this.value)"><br><span onclick="delW(${idx})" style="color:var(--sun);cursor:pointer;font-size:9px">УДАЛИТЬ</span></td>`;
            
            for(let d=1; d<=days; d++) {
                let k=`${y}_${m}_${d}`, h=w.d[k]?.h||0, a=w.d[k]?.a||0, p=w.d[k]?.p||0;
                let cellClass = h === 8 ? 'on' : (h === -1 ? 'off' : '');
                let cellText = (h > 0 && h !== 8) ? h : '';
                
                let sqClass = 'sq-a';
                let sqVal = '$';
                if(p > 0) {
                    sqClass += ' on-pay';
                    sqVal = p;
                } else if(a > 0) {
                    sqClass += ' on-adv';
                    sqVal = a;
                }

                html += `<td class="cd ${new Date(y, parseInt(m), d).getDay()===0?'sunday':''}" oncontextmenu="return false;">
                    <div class="sq-h ${cellClass}" onpointerdown="fastH(event, ${idx},'${k}')" oncontextmenu="setCus(event,${idx},'${k}')">${cellText}</div>
                    <div class="${sqClass}" 
                         onpointerdown="handleTouchStart(event, ${idx}, '${k}', ${total})" 
                         onpointerup="handleTouchEnd(event, ${idx}, '${k}')"
                         onpointercancel="handleTouchCancel()"
                         oncontextmenu="openPayModal(event, ${idx},'${k}', ${total})">${sqVal}</div>
                </td>`;
            }
            html += `<td class="ct">${fN(total)}</td>`;
            let row = document.createElement('tr'); row.innerHTML = html; tb.appendChild(row);
        });

        document.getElementById('totalFooter').innerHTML = `
            <div class="tf-item"><span class="tf-title">${dict[curL].total}</span><span class="tf-val">${fN(grandAccrued)}</span></div>
            <div class="tf-item"><span class="tf-title">${dict[curL].totAdv}</span><span class="tf-val">${fN(grandAdvance)}</span></div>
            <div class="tf-item"><span class="tf-title">${dict[curL].totPaid}</span><span class="tf-val" style="color:#60a5fa">${fN(grandPaid)}</span></div>
            <div class="tf-item"><span class="tf-title">${dict[curL].totBal}</span><span class="tf-val">${fN(grandBalance)}</span></div>
        `;
    }

    window.handleTouchStart = (e, i, k, total) => {
        if (e.button && e.button !== 0) return;
        isLongPress = false;
        holdTimer = setTimeout(() => {
            isLongPress = true;
            if (navigator.vibrate) navigator.vibrate(50);
            window.openPayModal(e, i, k, total);
        }, 500);
    }

    window.handleTouchEnd = (e, i, k) => {
        clearTimeout(holdTimer);
        if (!isLongPress && e.button === 0) {
            setTimeout(() => window.fastA(i, k), 50);
        }
    }

    window.handleTouchCancel = () => {
        clearTimeout(holdTimer);
    }

    window.saveData = async () => { 
        if(mode==='local') {
            localStorage.setItem('mp_data',JSON.stringify(workers));
        } else {
            setDoc(doc(db,"data",userUid),{w:workers});
        }
        render(); 
    }
    
    window.updR = (i,v) => { workers[i].r = v; saveData(); }
    window.delW = (i) => { if(confirm('Удалить?')) { workers.splice(i,1); saveData(); } }

    window.fastH = (e, i, k) => {
        if (e.button !== 0) return;
        if(!workers[i].d[k]) workers[i].d[k]={};
        let cur = workers[i].d[k].h || 0;
        workers[i].d[k].h = (cur === 0) ? 8 : (cur === 8 ? -1 : 0);
        saveData();
    }

    window.fastA = (i, k) => {
        let v = prompt(dict[curL].adv); 
        if(v !== null) { 
            if(!workers[i].d[k]) workers[i].d[k] = {}; 
            let num = parseFloat(v) || 0;
            workers[i].d[k].a = num;
            workers[i].d[k].p = 0;
            saveData(); 
        }
    }

    window.openPayModal = (e, i, k, remaining) => {
        if(e) e.preventDefault();
        if(remaining <= 0 && (!workers[i].d[k] || !workers[i].d[k].p)) {
            alert("У мастера нет остатка к выплате!");
            return;
        }
        
        let payAmount = (workers[i].d[k] && workers[i].d[k].p) ? workers[i].d[k].p : remaining;
        activePayTarget = { i, k, amount: payAmount };

        document.getElementById('pay-msg').innerText = `Выплатить остаток ${fN(payAmount)} TJS мастеру ${workers[i].n}?`;
        document.getElementById('modal-pay').classList.remove('hidden');
    }

    window.closePayModal = () => {
        document.getElementById('modal-pay').classList.add('hidden');
        activePayTarget = null;
    }

    document.getElementById('pay-btn-yes').onclick = () => {
        if(activePayTarget) {
            const { i, k, amount } = activePayTarget;
            if(!workers[i].d[k]) workers[i].d[k] = {};
            workers[i].d[k].p = amount;
            workers[i].d[k].a = 0;
            saveData();
        }
        closePayModal();
    }

    window.setCus = (e,i,k) => { e.preventDefault(); let v = prompt(dict[curL].qh); if(v !== null) { if(!workers[i].d[k]) workers[i].d[k]={}; workers[i].d[k].h = parseInt(v) || 0; saveData(); } }

    window.genPDF = () => {
        const { jsPDF } = window.jspdf;
        const docP = new jsPDF('l', 'mm', 'a4'); 
        const y = yS.value, m = mS.value;
        const monthNameLat = tr(dict['ru'].mo[m]); 

        docP.setFontSize(18);
        docP.setTextColor(249, 115, 22);
        docP.text(`SUGD BETON REPORT - ${monthNameLat} ${y}`, 148, 15, {align:"center"});
        
        let grandTotal = 0;
        let rows = workers.map(w => {
            let totalSalary = 0, totalHours = 0, totalAdvance = 0, totalPaid = 0; 
            const dCount = new Date(y, parseInt(m)+1, 0).getDate();
            for(let d=1; d<=dCount; d++){
                let k = `${y}_${m}_${d}`, h = w.d[k]?.h || 0, a = w.d[k]?.a || 0, p = w.d[k]?.p || 0;
                let cH = h > 0 ? h : 0; 
                totalHours += cH; 
                totalAdvance += a;
                totalPaid += p;
                totalSalary += (cH * (w.r/8)) - a - p;
            }
            grandTotal += totalSalary;
            
            let daysFormatted = (totalHours / 8).toFixed(1).replace('.0', '');
            
            return [
                tr(w.n), 
                w.r, 
                totalHours, 
                daysFormatted, 
                fN(totalAdvance), 
                fN(totalPaid),
                fN(totalSalary) + " TJS"
            ];
        });

        rows.push([
            { content: 'GRAND TOTAL:', colSpan: 6, styles: { halign: 'right', fontStyle: 'bold' } },
            { content: fN(grandTotal) + " TJS", styles: { fontStyle: 'bold', fillColor: [249, 115, 22], textColor: 255 } }
        ]);

        docP.autoTable({ 
            head: [['Master Name', 'Rate/Day', 'Hours', 'Days(8h)', 'Advance', 'Paid Out', 'Remaining']], 
            body: rows, 
            startY: 25, 
            theme: 'grid', 
            headStyles: { fillColor: [249, 115, 22], halign: 'center' },
            styles: { fontSize: 10, halign: 'center', cellPadding: 3 },
            columnStyles: {
                0: { halign: 'left', fontStyle: 'bold' },
                6: { fontStyle: 'bold' }
            }
        });

        docP.save(`Sugd_Beton_Report_${monthNameLat}_${y}.pdf`);
    }

    const mS=document.getElementById('mS'), yS=document.getElementById('yS');
    for(let y=2025; y<=2028; y++) yS.add(new Option(y, y, false, y===new Date().getFullYear()));
    if(localStorage.getItem('user_mode')) { mode = localStorage.getItem('user_mode'); userUid = localStorage.getItem('user_uid') || 'local_user'; checkPinSetup(); }
    setLang('ru');
</script>
